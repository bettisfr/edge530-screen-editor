          <text x="74.5" y="158.6">34.2</text><text x="165.5" y="158.6">86</text>
          <text x="74.5" y="203.2">1:24</text><text x="165.5" y="203.2">4.1</text>
          <text x="74.5" y="247.8">312</text><text x="165.5" y="247.8">26.1</text>
