<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" role="img" aria-labelledby="title description">
  <title id="title">Garmin Edge 530 screen mockup</title>
  <desc id="description">A slightly tilted Garmin Edge 530 showing a sample ten-field Road screen.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a3e"/>
      <stop offset="1" stop-color="#101c1f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#414e51"/>
      <stop offset="1" stop-color="#192326"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-15%" width="160%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#17272b" flood-opacity=".24"/>
    </filter>
  </defs>
  <g transform="rotate(2 240 330)" filter="url(#shadow)">
    <g transform="translate(72 58) scale(1.4)">
      <path d="M45 4C72-1 168-1 195 4c24 5 39 23 41 51v270c0 25-12 44-34 54-30 14-134 14-164 0C16 369 4 350 4 325V55C6 28 21 9 45 4Z" fill="url(#shell)" stroke="#344448" stroke-width="2"/>
      <path d="M13 348c29 30 185 30 214 0" fill="none" stroke="#354145" stroke-width="6" stroke-linecap="round"/>
      <circle cx="74" cy="43" r="4" fill="#101719" stroke="#2b3538"/>
      <rect x="24" y="56.5" width="192" height="251.5" rx="5" fill="#080d0e"/>
      <rect x="29" y="61.5" width="182" height="241.5" rx="2" fill="#e5e7e8"/>
      <rect x="29" y="61.5" width="182" height="18" fill="#d4d8da"/>
      <text x="35" y="73.5" fill="#343b3e" font-family="Arial,sans-serif" font-size="7">10:08</text>
      <text x="205" y="73.5" text-anchor="end" fill="#343b3e" font-family="Arial,sans-serif" font-size="7">GPS  ●  ▰</text>
      <g fill="#e9e9dc" stroke="#aeb5b8" stroke-width=".55">
        <rect x="29" y="79.5" width="91" height="44.6"/><rect x="120" y="79.5" width="91" height="44.6"/>
        <rect x="29" y="124.1" width="91" height="44.6"/><rect x="120" y="124.1" width="91" height="44.6"/>
        <rect x="29" y="168.7" width="91" height="44.6"/><rect x="120" y="168.7" width="91" height="44.6"/>
        <rect x="29" y="213.3" width="91" height="44.6"/><rect x="120" y="213.3" width="91" height="44.6"/>
        <rect x="29" y="257.9" width="91" height="44.6"/><rect x="120" y="257.9" width="91" height="44.6"/>
      </g>
      <g text-anchor="middle" font-family="Arial,sans-serif">
        <g fill="#687176" font-size="6.5" font-weight="400">
          <text x="74.5" y="95">Speed</text><text x="165.5" y="95">Heart rate</text>
          <text x="74.5" y="139.6">Distance</text><text x="165.5" y="139.6">Cadence</text>
          <text x="74.5" y="184.2">Timer</text><text x="165.5" y="184.2">Grade</text>
          <text x="74.5" y="228.8">Elevation</text><text x="165.5" y="228.8">Avg speed</text>
